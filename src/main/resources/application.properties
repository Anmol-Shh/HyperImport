# ============================================================
# CustomerImport — application configuration
# ============================================================

# Resolved dependency versions (from spring-boot-dependencies BOM, Boot 4.1.2):
#   spring-batch version:   6.0.6
#   testcontainers version: 2.0.5
# Update these comments if the pom parent version changes.
# All Spring Batch API references in this project cite the 6.0.6 Javadoc.

# ---- Datasource (targets the Docker Compose managed Postgres) ----
spring.datasource.url=jdbc:postgresql://localhost:5433/customerimport
spring.datasource.username=customerimport
spring.datasource.password=customerimport
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Flyway owns all DDL ----
# Batch metadata tables and staging schema are created by Flyway migrations in
# db/migration/. Setting this to 'never' ensures Batch never auto-creates its
# own schema, even on embedded databases, making the behaviour explicit and
# unconditional. See ADR-002 (added in PR 2).
spring.batch.jdbc.initialize-schema=never

# ---- On-demand job execution ----
# Jobs are launched via the REST endpoint (PR 5), not at application startup.
# Disabling auto-launch also avoids Boot trying to run jobs during integration
# tests that only test infrastructure wiring.
spring.batch.job.enabled=false
